<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole</title>
    <!-- 
        Whack-a-Mole Game
        =================
        Juego arcade clásico con dificultad progresiva y sistema de bombas.
        
        Estructura:
        - #config-panel: Configuración inicial (nombre, duración, bombas)
        - #game-panel: Tablero de juego con 9 hoyos
        - #game-over-panel: Resumen de fin de partida
        - .ranking-panel: Tabla de mejores puntajes
        
        Dependencias:
        - style.css: Estilos y animaciones
        - game.js: Lógica del juego
        - hammer.svg, hammer-hit.svg: Cursores personalizados
    -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🔨 Whack-a-Mole 🔨</h1>
        
        <!-- 
            Panel de Configuración
            Visible al inicio y al presionar "Jugar de Nuevo".
            Permite configurar: nombre del jugador, duración (1-5 min), bombas on/off.
        -->
        <div id="config-panel" class="panel">
            <h2>Configuración</h2>
            <div class="config-item">
                <!-- Campo obligatorio para identificar al jugador en el ranking -->
                <label for="player-name">Nombre del jugador:</label>
                <input type="text" id="player-name" placeholder="Ingresa tu nombre" maxlength="20">
            </div>
            <div class="config-item">
                <!-- Duración en segundos: 60, 120, 180, 240, 300 -->
                <label for="game-duration">Duración del juego:</label>
                <select id="game-duration">
                    <option value="60">1 minuto</option>
                    <option value="120">2 minutos</option>
                    <option value="180" selected>3 minutos</option>
                    <option value="240">4 minutos</option>
                    <option value="300">5 minutos</option>
                </select>
            </div>
            <div class="config-checkbox">
                <!-- Activa/desactiva bombas que terminan el juego instantáneamente -->
                <input type="checkbox" id="bombs-enabled" checked>
                <label for="bombs-enabled">
                    <span class="bomb-icon">💣</span>
                    Activar bombas (terminan el juego si las golpeas)
                </label>
            </div>
            <button id="start-btn" class="btn-primary">¡Iniciar Juego!</button>
        </div>

        <!-- 
            Panel de Juego
            Visible durante la partida activa.
            Contiene: info del jugador, tablero 3x3, botón terminar.
        -->
        <div id="game-panel" class="panel hidden">
            <!-- Barra de información: jugador, puntaje, tiempo, dificultad -->
            <div class="game-info">
                <div class="info-item">
                    <span>Jugador:</span>
                    <span id="current-player">-</span>
                </div>
                <div class="info-item">
                    <span>Puntaje:</span>
                    <span id="score">0</span>
                </div>
                <div class="info-item">
                    <span>Tiempo:</span>
                    <span id="timer">0:00</span>
                </div>
                <div class="info-item">
                    <span>Dificultad:</span>
                    <!-- Indicador dinámico: easy, medium, hard, insane -->
                    <span id="difficulty-indicator" class="difficulty-indicator difficulty-easy">😊 Fácil</span>
                </div>
            </div>

            <!-- 
                Tablero del juego - Grid 3x3
                Los 9 hoyos se generan dinámicamente en createHoles().
                Cada hoyo contiene un elemento .mole que puede ser topo o bomba.
            -->
            <div class="game-board" id="game-board">
                <!-- Los hoyos se generan dinámicamente -->
            </div>

            <button id="end-btn" class="btn-secondary">Terminar Juego</button>
        </div>

        <!-- 
            Panel de Fin de Juego
            Visible al terminar (tiempo agotado o bomba golpeada).
            Muestra razón del fin, puntaje final, opción de reiniciar.
        -->
        <div id="game-over-panel" class="panel hidden">
            <h2>¡Juego Terminado!</h2>
            <!-- Mensaje dinámico según gameOverReason: 'time' o 'bomb' -->
            <div id="game-over-message" class="game-over-message time-message">
                ⏱️ ¡Tiempo terminado!
            </div>
            <div class="final-score">
                <p>Jugador: <span id="final-player">-</span></p>
                <p>Puntaje Final: <span id="final-score">0</span></p>
            </div>
            <button id="play-again-btn" class="btn-primary">Jugar de Nuevo</button>
        </div>

        <!-- 
            Panel de Ranking
            Siempre visible. Muestra los 10 mejores puntajes.
            Datos persistidos en localStorage bajo 'whackamole_scores'.
        -->
        <div class="ranking-panel">
            <h2>🏆 Ranking 🏆</h2>
            <table id="ranking-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jugador</th>
                        <th>Puntaje</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="ranking-body">
                    <!-- Se llena dinámicamente en loadRanking() -->
                </tbody>
            </table>
            <button id="clear-ranking-btn" class="btn-danger">Limpiar Ranking</button>
        </div>
    </div>

    <!-- Lógica principal del juego -->
    <script src="game.js"></script>
</body>
</html>
