<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Sombra -->
  <ellipse cx="18" cy="30" rx="8" ry="2" fill="#000" opacity="0.2"/>
  
  <!-- Mango del martillo -->
  <rect x="13" y="14" width="6" height="18" rx="1.5" fill="url(#mango)"/>
  <defs>
    <linearGradient id="mango" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5D3A1A"/>
      <stop offset="30%" style="stop-color:#8B4513"/>
      <stop offset="70%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#6B4423"/>
    </linearGradient>
  </defs>
  
  <!-- Cabeza del martillo -->
  <rect x="2" y="2" width="28" height="13" rx="2" fill="url(#metal)"/>
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9CA3AF"/>
      <stop offset="50%" style="stop-color:#6B7280"/>
      <stop offset="100%" style="stop-color:#4B5563"/>
    </linearGradient>
  </defs>
  
  <!-- Borde superior brillante -->
  <rect x="3" y="3" width="26" height="2" rx="1" fill="#D1D5DB"/>
  
  <!-- Línea de separación -->
  <rect x="3" y="11" width="26" height="2" fill="#374151"/>
  
  <!-- Caras laterales del martillo -->
  <rect x="0" y="3" width="5" height="11" rx="1" fill="#71797E"/>
  <rect x="27" y="3" width="5" height="11" rx="1" fill="#71797E"/>
  
  <!-- Brillo lateral -->
  <rect x="1" y="4" width="1.5" height="6" fill="#9CA3AF" rx="0.5"/>
  <rect x="28" y="4" width="1.5" height="6" fill="#9CA3AF" rx="0.5"/>
</svg>
