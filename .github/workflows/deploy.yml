# =============================================================================
# Deploy Pipeline - Whack-a-Mole
# =============================================================================
# Este workflow despliega automáticamente a GitHub Pages cuando hay un merge
# a la rama main.
#
# Requisitos:
# 1. Habilitar GitHub Pages en Settings > Pages
# 2. Seleccionar "GitHub Actions" como source
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  
  # Permite ejecutar manualmente desde Actions tab
  workflow_dispatch:

# Permisos necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar deploys concurrentes
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job: Build - Construir para producción
  # ===========================================================================
  build:
    name: 🏗️ Build for Production
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build project
        run: npm run build

      - name: 📄 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ===========================================================================
  # Job: Deploy - Desplegar a GitHub Pages
  # ===========================================================================
  deploy:
    name: 🚀 Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
