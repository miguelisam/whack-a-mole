<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="mango2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D3A1A"/>
      <stop offset="50%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#6B4423"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#606060"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0BD"/>
      <stop offset="100%" stop-color="#E8B88A"/>
    </linearGradient>
  </defs>
  
  <!-- Martillo rotado (golpeando) -->
  <g transform="rotate(45 16 16)">
    <!-- Mango -->
    <rect x="14" y="10" width="4" height="16" rx="1" fill="url(#mango2)"/>
    <!-- Cabeza -->
    <rect x="4" y="2" width="24" height="9" rx="2" fill="url(#metal2)"/>
    <rect x="5" y="3" width="22" height="2" fill="#E0E0E0"/>
    <!-- Laterales -->
    <rect x="2" y="3" width="4" height="7" rx="1" fill="#707070"/>
    <rect x="26" y="3" width="4" height="7" rx="1" fill="#707070"/>
  </g>
  
  <!-- Mano simplificada -->
  <g transform="translate(8, 20)">
    <ellipse cx="8" cy="5" rx="7" ry="5" fill="url(#skin2)"/>
    <rect x="4" y="0" width="3" height="6" rx="1.5" fill="url(#skin2)"/>
    <rect x="8" y="-1" width="3" height="7" rx="1.5" fill="url(#skin2)"/>
    <rect x="12" y="0" width="3" height="6" rx="1.5" fill="url(#skin2)"/>
    <ellipse cx="2" cy="4" rx="3" ry="2" fill="url(#skin2)"/>
  </g>
  
  <!-- Efecto de impacto estático -->
  <circle cx="4" cy="28" r="3" fill="#FFD700" opacity="0.9"/>
  <circle cx="4" cy="28" r="5" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Chispas estáticas -->
  <circle cx="2" cy="24" r="1" fill="#FFEB3B"/>
  <circle cx="8" cy="30" r="1" fill="#FFD700"/>
  <circle cx="6" cy="26" r="0.8" fill="#FFA500"/>
</svg>
</svg>
