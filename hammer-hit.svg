<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="mango2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5D3A1A"/>
      <stop offset="30%" style="stop-color:#8B4513"/>
      <stop offset="70%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#6B4423"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9CA3AF"/>
      <stop offset="50%" style="stop-color:#6B7280"/>
      <stop offset="100%" style="stop-color:#4B5563"/>
    </linearGradient>
  </defs>
  
  <!-- Martillo rotado (golpeando) -->
  <g transform="rotate(35 20 20)">
    <!-- Mango del martillo -->
    <rect x="17" y="16" width="6" height="20" rx="1.5" fill="url(#mango2)"/>
    
    <!-- Cabeza del martillo -->
    <rect x="6" y="4" width="28" height="13" rx="2" fill="url(#metal2)"/>
    
    <!-- Borde superior brillante -->
    <rect x="7" y="5" width="26" height="2" rx="1" fill="#D1D5DB"/>
    
    <!-- Línea de separación -->
    <rect x="7" y="13" width="26" height="2" fill="#374151"/>
    
    <!-- Caras laterales del martillo -->
    <rect x="4" y="5" width="5" height="11" rx="1" fill="#71797E"/>
    <rect x="31" y="5" width="5" height="11" rx="1" fill="#71797E"/>
  </g>
  
  <!-- Efecto de impacto -->
  <circle cx="8" cy="34" r="4" fill="#FFD700" opacity="0.9">
    <animate attributeName="r" values="2;6;2" dur="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="0.3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ondas de impacto -->
  <circle cx="8" cy="34" r="7" fill="none" stroke="#FFA500" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="4;10" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="0.4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Estrellas de impacto -->
  <text x="2" y="28" font-size="8" fill="#FFD700">✦</text>
  <text x="12" y="38" font-size="6" fill="#FFA500">✧</text>
  <text x="0" y="36" font-size="7" fill="#FFEB3B">★</text>
</svg>
