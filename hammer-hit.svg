<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs>
    <!-- Gradiente para el mango de madera -->
    <linearGradient id="mango2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5D3A1A"/>
      <stop offset="30%" style="stop-color:#8B4513"/>
      <stop offset="70%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#6B4423"/>
    </linearGradient>
    <!-- Gradiente metálico para la cabeza -->
    <linearGradient id="metal2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="30%" style="stop-color:#A8A8A8"/>
      <stop offset="70%" style="stop-color:#808080"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
    <!-- Gradiente para la piel de la mano -->
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0BD"/>
      <stop offset="50%" style="stop-color:#FFCD94"/>
      <stop offset="100%" style="stop-color:#E8B88A"/>
    </linearGradient>
    <!-- Gradiente para efectos de impacto -->
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFF00"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Martillo golpeando (rotado) -->
  <g transform="rotate(40 28 28)">
    <!-- Grupo del martillo -->
    <g transform="translate(4, 0)">
      <!-- Mango del martillo -->
      <rect x="20" y="14" width="8" height="32" rx="2" fill="url(#mango2)"/>
      <rect x="21" y="15" width="2" height="28" rx="1" fill="#9B6B43" opacity="0.5"/>
      
      <!-- Cabeza del martillo -->
      <rect x="4" y="2" width="40" height="14" rx="3" fill="url(#metal2)"/>
      
      <!-- Detalles de la cabeza -->
      <rect x="5" y="3" width="38" height="3" rx="1" fill="#E0E0E0"/>
      <rect x="5" y="12" width="38" height="2" fill="#505050"/>
      
      <!-- Caras laterales (zona de golpe) -->
      <rect x="0" y="3" width="7" height="12" rx="2" fill="#707070"/>
      <rect x="41" y="3" width="7" height="12" rx="2" fill="#707070"/>
      
      <!-- Brillos metálicos -->
      <rect x="2" y="5" width="2" height="6" rx="1" fill="#B0B0B0"/>
      <rect x="44" y="5" width="2" height="6" rx="1" fill="#B0B0B0"/>
    </g>
    
    <!-- Mano sosteniendo el martillo -->
    <g transform="translate(14, 30)">
      <!-- Palma de la mano -->
      <ellipse cx="14" cy="10" rx="12" ry="8" fill="url(#skin2)"/>
      
      <!-- Dedos agarrando el mango -->
      <rect x="8" y="2" width="6" height="10" rx="3" fill="url(#skin2)"/>
      <rect x="14" y="0" width="6" height="12" rx="3" fill="url(#skin2)"/>
      <rect x="20" y="2" width="5" height="10" rx="2.5" fill="url(#skin2)"/>
      <rect x="25" y="5" width="4" height="8" rx="2" fill="url(#skin2)"/>
      
      <!-- Pulgar -->
      <ellipse cx="5" cy="8" rx="5" ry="4" fill="url(#skin2)" transform="rotate(-30 5 8)"/>
    </g>
  </g>
  
  <!-- Efectos de impacto en la zona de golpe -->
  <!-- Destello principal -->
  <circle cx="8" cy="48" r="6" fill="url(#impact)">
    <animate attributeName="r" values="3;8;3" dur="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="0.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ondas de impacto -->
  <circle cx="8" cy="48" r="10" fill="none" stroke="#FFD700" stroke-width="2.5" opacity="0.8">
    <animate attributeName="r" values="6;14" dur="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="8" cy="48" r="14" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="10;20" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="0.4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Estrellas/chispas de impacto -->
  <g fill="#FFD700">
    <text x="0" y="42" font-size="10" opacity="0.9">✦</text>
    <text x="14" y="54" font-size="8" fill="#FFA500">✧</text>
    <text x="2" y="52" font-size="9" fill="#FFEB3B">★</text>
    <text x="16" y="44" font-size="7" fill="#FFE0B2">✴</text>
  </g>
  
  <!-- Líneas de movimiento -->
  <g stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="20" y1="12" x2="28" y2="4">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="24" y1="16" x2="34" y2="8">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="28" y1="20" x2="38" y2="14">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="0.15s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
</svg>
